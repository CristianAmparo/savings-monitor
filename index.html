<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Savings Monitor</title>
    <meta name="description" content="Offline personal finance: savings, expenses and taxi income records." />
    <meta name="theme-color" content="#1e4fd8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var theme = JSON.parse(localStorage.getItem('sm.theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
      <main class="page" id="view" tabindex="-1">
        <div class="skeleton"></div>
      </main>
    </div>
    <div id="overlay-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>
    <noscript>This app needs JavaScript to run.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
